<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main server box -->
  <rect x="12" y="16" width="40" height="32" rx="4" fill="url(#grad1)"/>
  <!-- Server lines -->
  <rect x="18" y="24" width="20" height="3" rx="1.5" fill="#fff"/>
  <rect x="18" y="31" width="16" height="3" rx="1.5" fill="#fff" opacity="0.7"/>
  <rect x="18" y="38" width="12" height="3" rx="1.5" fill="#fff" opacity="0.5"/>
  <!-- Status light -->
  <circle cx="46" cy="25.5" r="3" fill="#22c55e"/>
  <!-- Connection nodes -->
  <circle cx="8" cy="32" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="32" r="5" fill="#f59e0b"/>
  <circle cx="32" cy="8" r="5" fill="#06b6d4"/>
  <circle cx="32" cy="56" r="5" fill="#06b6d4"/>
  <!-- Connection lines -->
  <line x1="12" y1="32" x2="8" y2="32" stroke="#f59e0b" stroke-width="2"/>
  <line x1="52" y1="32" x2="56" y2="32" stroke="#f59e0b" stroke-width="2"/>
  <line x1="32" y1="16" x2="32" y2="8" stroke="#06b6d4" stroke-width="2"/>
  <line x1="32" y1="48" x2="32" y2="56" stroke="#06b6d4" stroke-width="2"/>
</svg>
